name: Desktop (Windows)

# MicMask 电脑版（desktop/，Compose Desktop）。与安卓 build.yml 完全分开：
#   push 到 feat/desktop-windows -> 打包 MSI + EXE，上传为 workflow 产物（版本号 <appVersion>-dev.<run>）
#   push win-v* 标签             -> 同上，再发 GitHub Release：一律 prerelease、make_latest=false，绝不顶掉安卓的 Latest
#   workflow_dispatch            -> 手动跑一次（同分支构建）
# 安卓 build.yml 只认 main 分支与 v* 标签，这里的分支/标签都不会触发它。
on:
  push:
    branches: [feat/desktop-windows]
    tags: ['win-v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  # VB-CABLE 官方包（VB-Audio Software，捐赠软件，vb-cable.com）。许可允许原样随软件分发：
  # https://vb-audio.com/Services/licensing.htm 「VB-CABLE Distribution with another product」。只下载、校验、原样打包，不改内容。
  VBCABLE_URL: https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack46.zip
  VBCABLE_SHA256: bc44e8974191a5a2427d6c979e2dab08dbb09925f3f435dfa2f0ba3e45b6eb90

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: ver
        run: |
          BASE=$(sed -n 's/^appVersion=\(.*\)$/\1/p' desktop/gradle.properties | head -n1)
          if [[ "$GITHUB_REF" == refs/tags/win-v* ]]; then
            VER="${GITHUB_REF_NAME#win-v}"
          else
            VER="${BASE%-dev}-dev.${GITHUB_RUN_NUMBER}"
          fi
          if ! [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then echo "::error::版本号 $VER 不是 MAJOR.MINOR.BUILD 开头"; exit 1; fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "MicMask 电脑版 $VER"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      # 签名方式（不打印任何密钥）：pfx = secrets 里有 WINDOWS_CERT_PFX_BASE64 + WINDOWS_CERT_PASSWORD；
      # azure = Azure Trusted Signing（secrets AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET + 仓库变量
      # TRUSTED_SIGNING_ENDPOINT / TRUSTED_SIGNING_ACCOUNT / TRUSTED_SIGNING_PROFILE）；都没有 = none（产物未签名）。说明见 docs/desktop-signing.md
      - name: Signing config
        id: sign
        env:
          HAS_PFX: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' && secrets.WINDOWS_CERT_PASSWORD != '' }}
          HAS_AZ: ${{ secrets.AZURE_TENANT_ID != '' && secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_CLIENT_SECRET != '' && vars.TRUSTED_SIGNING_ENDPOINT != '' && vars.TRUSTED_SIGNING_ACCOUNT != '' && vars.TRUSTED_SIGNING_PROFILE != '' }}
          HAS_BEACON: ${{ secrets.BEACON_URL != '' && secrets.BEACON_APP_ID != '' && (secrets.DESKTOP_BEACON_KEY != '' || secrets.BEACON_KEY != '') }}
        run: |
          if [ "$HAS_PFX" = "true" ]; then M=pfx; elif [ "$HAS_AZ" = "true" ]; then M=azure; else M=none; fi
          echo "mode=$M" >> "$GITHUB_OUTPUT"
          case $M in
            pfx) echo "代码签名：PFX 证书（signtool + 时间戳）";;
            azure) echo "代码签名：Azure Trusted Signing";;
            *) echo "::warning::未签名：仓库 secrets 里没有 WINDOWS_CERT_PFX_BASE64 / WINDOWS_CERT_PASSWORD，也没有 Azure Trusted Signing 配置。安装包未签名（Windows SmartScreen 会提示「未知发布者」）。";;
          esac
          if [ "$HAS_BEACON" = "true" ]; then echo "Beacon：已配置（统计/公告/赞赏墙开启，plat=windows）"; else echo "Beacon：未配置（secrets.BEACON_URL / BEACON_APP_ID / BEACON_KEY（或 DESKTOP_BEACON_KEY）不全）→ 电脑版统计/公告/赞赏墙整体关闭，不发任何请求"; fi

      # native 音频库（WASAPI / 按进程抓声音）：MSVC 编译 → desktop/resources/windows/mmaudio.dll，随安装包放进 app 资源目录
      - name: Build native audio library (mmaudio.dll)
        shell: cmd
        run: call desktop\native\build.cmd

      - name: Check mmaudio.dll exports
        shell: pwsh
        run: |
          $dll = 'desktop/resources/windows/mmaudio.dll'
          if (-not (Test-Path $dll)) { throw 'mmaudio.dll 没有生成' }
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe | Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          if ($dumpbin) { & $dumpbin.FullName /nologo /exports $dll | Select-String 'mm_' | Out-Host; & $dumpbin.FullName /nologo /dependents $dll | Select-String '\.dll' | Out-Host }
          Write-Host ("mmaudio.dll {0:N0} 字节" -f (Get-Item $dll).Length)

      - name: Sign mmaudio.dll (PFX)
        if: steps.sign.outputs.mode == 'pfx'
        shell: pwsh
        env:
          CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: ./desktop/packaging/sign.ps1 desktop/resources/windows/mmaudio.dll

      - name: Sign mmaudio.dll (Azure Trusted Signing)
        if: steps.sign.outputs.mode == 'azure'
        uses: Azure/artifact-signing-action@v1.2.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.TRUSTED_SIGNING_PROFILE }}
          files-folder: desktop/resources/windows
          files-folder-filter: dll
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Fetch VB-CABLE (official, unmodified)
        run: |
          mkdir -p desktop/resources/windows/vbcable
          curl -fsSL --retry 3 -o desktop/resources/windows/vbcable/VBCABLE_Driver_Pack46.zip "$VBCABLE_URL"
          echo "$VBCABLE_SHA256  desktop/resources/windows/vbcable/VBCABLE_Driver_Pack46.zip" | sha256sum -c -

      # release 构建：ProGuard 摇树 + jlink 精简 JDK（只带 build.gradle.kts 里 modules(...) 列的模块）+ 只带 x64 Skia
      - name: Package MSI / EXE (release)
        working-directory: desktop
        # 电脑版 Beacon：与手机同一后台/App（URL、App ID、key 同手机）；DESKTOP_BEACON_KEY 有值时优先用它，否则共用手机的 BEACON_KEY；任一为空 = 整体关闭。统计带 ch=windows / plat=windows
        env:
          BEACON_URL: ${{ secrets.BEACON_URL }}
          BEACON_APP_ID: ${{ secrets.BEACON_APP_ID }}
          BEACON_KEY: ${{ secrets.DESKTOP_BEACON_KEY || secrets.BEACON_KEY }}
        run: ./gradlew --no-daemon --stacktrace -PappVersion="${{ steps.ver.outputs.version }}" packageReleaseMsi packageReleaseExe

      - name: Packaging logs (on failure)
        if: failure()
        run: |
          for f in $(find desktop/build/compose/logs -type f 2>/dev/null); do echo "===== $f"; tail -n 60 "$f"; done

      - name: Sign MSI / EXE (PFX)
        if: steps.sign.outputs.mode == 'pfx'
        shell: pwsh
        env:
          CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $f = @(Get-ChildItem desktop/build/compose/binaries/main-release/msi/*.msi) + @(Get-ChildItem desktop/build/compose/binaries/main-release/exe/*.exe)
          ./desktop/packaging/sign.ps1 @($f | ForEach-Object { $_.FullName })

      - name: Sign MSI (Azure Trusted Signing)
        if: steps.sign.outputs.mode == 'azure'
        uses: Azure/artifact-signing-action@v1.2.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.TRUSTED_SIGNING_PROFILE }}
          files-folder: desktop/build/compose/binaries/main-release/msi
          files-folder-filter: msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Sign EXE (Azure Trusted Signing)
        if: steps.sign.outputs.mode == 'azure'
        uses: Azure/artifact-signing-action@v1.2.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.TRUSTED_SIGNING_PROFILE }}
          files-folder: desktop/build/compose/binaries/main-release/exe
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Signature status
        shell: pwsh
        run: |
          $f = @(Get-ChildItem desktop/build/compose/binaries/main-release/msi/*.msi) + @(Get-ChildItem desktop/build/compose/binaries/main-release/exe/*.exe) + @(Get-Item desktop/resources/windows/mmaudio.dll)
          foreach ($x in $f) { $s = Get-AuthenticodeSignature $x.FullName; Write-Host ("{0}: {1}{2}" -f $x.Name, $(if ($s.Status -eq 'NotSigned') { '未签名' } else { $s.Status }), $(if ($s.SignerCertificate) { ' · ' + $s.SignerCertificate.Subject } else { '' })) }

      # 冒烟：把 MSI 管理员解包（等同安装后的文件），运行 MicMask.exe --smoke：
      # 离屏渲染整页 Compose/miuix、Skia DLL、加解密/TLS、Opus 本机回环、mDNS、声卡枚举，再真开窗口 3 秒自动关。
      - name: Smoke test (installed files)
        shell: pwsh
        run: |
          $msi = Get-ChildItem desktop/build/compose/binaries/main-release/msi/*.msi | Select-Object -First 1
          $dst = Join-Path $env:RUNNER_TEMP 'mm-msi'
          $p = Start-Process msiexec.exe -ArgumentList '/a', "`"$($msi.FullName)`"", '/qn', "TARGETDIR=`"$dst`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec /a 失败：$($p.ExitCode)" }
          $exe = Get-ChildItem $dst -Recurse -Filter MicMask.exe | Select-Object -First 1
          if (-not $exe) { throw '解包后没找到 MicMask.exe' }
          Write-Host "运行 $($exe.FullName)"
          $log = Join-Path $env:RUNNER_TEMP 'micmask-smoke.txt'
          $app = Start-Process $exe.FullName -ArgumentList '--smoke', "--smoke-out=$log" -PassThru
          $null = $app.Handle  # 先拿句柄，否则进程退出后 ExitCode 读不到
          if (-not $app.WaitForExit(180000)) { $app.Kill(); throw '自测超时（180 秒）' }
          if (Test-Path $log) { Get-Content $log -Encoding UTF8 } else { Write-Host '没有自测日志' }
          $mm = Get-ChildItem $dst -Recurse -Filter mmaudio.dll | Select-Object -First 1
          if (-not $mm) { throw '安装包里没有 mmaudio.dll' }
          $vb = Get-ChildItem $dst -Recurse -Filter VBCABLE_Driver_Pack46.zip | Select-Object -First 1
          if (-not $vb) { throw '安装包里没有 VB-CABLE 包' }
          $rt = (Get-ChildItem (Join-Path $exe.DirectoryName 'runtime') -Recurse -File | Measure-Object Length -Sum).Sum
          $ap = (Get-ChildItem (Join-Path $exe.DirectoryName 'app') -Recurse -File | Measure-Object Length -Sum).Sum
          Write-Host ("解包体积：runtime {0:N1} MB，app {1:N1} MB" -f ($rt/1MB), ($ap/1MB))
          if ($app.ExitCode -ne 0) { throw "自测失败，退出码 $($app.ExitCode)" }
          if (-not (Select-String -Path $log -Pattern 'SMOKE OK' -SimpleMatch -Quiet)) { throw '无界面自测没通过' }
          if (-not (Select-String -Path $log -Pattern 'WINDOW OK' -SimpleMatch -Quiet)) { throw '窗口自测没通过' }

      # 单实例 + 冷启动：正常启动解包目录里的 MicMask.exe（等首帧日志），再启动一次：第二个进程应把激活请求交给第一个并立即退出
      - name: Single instance / cold start
        shell: pwsh
        run: |
          $dst = Join-Path $env:RUNNER_TEMP 'mm-msi'
          $exe = Get-ChildItem $dst -Recurse -Filter MicMask.exe | Select-Object -First 1
          $logDir = Join-Path $env:LOCALAPPDATA 'MicMask\logs'
          $since = Get-Date
          function NewLog { Get-ChildItem $logDir -Filter 'micmask-desktop-*.log' -ErrorAction SilentlyContinue | Where-Object { $_.LastWriteTime -ge $since } | Sort-Object LastWriteTime | Select-Object -Last 1 }
          function Find($pat) { $l = NewLog; if ($l) { Select-String -Path $l.FullName -Encoding utf8 -Pattern $pat | Where-Object { $_.Line -notmatch '^\s*$' } | Select-Object -Last 1 } }
          $p1 = Start-Process $exe.FullName -PassThru; $null = $p1.Handle
          $ff = $null
          for ($i = 0; $i -lt 120 -and -not $ff; $i++) { Start-Sleep -Milliseconds 500; $ff = Find '首帧' }
          if (-not $ff) { throw '60 秒内没有首帧日志' }
          Write-Host "冷启动：$($ff.Line)"
          for ($i = 0; $i -lt 20 -and -not (Find '后台初始化'); $i++) { Start-Sleep -Milliseconds 500 }
          $bg = Find '后台初始化'; Write-Host "后台：$($bg.Line)"
          Start-Sleep -Seconds 2
          $t0 = Get-Date
          $p2 = Start-Process $exe.FullName -ArgumentList '--from-ci' -PassThru; $null = $p2.Handle
          if (-not $p2.WaitForExit(15000)) { $p2.Kill(); $p1.Kill(); throw '第二个实例 15 秒没退出（单实例没生效）' }
          $ms = [int]((Get-Date) - $t0).TotalMilliseconds
          Start-Sleep -Seconds 1
          $act = Find '激活请求'
          $alive = -not $p1.HasExited
          Write-Host "第二次启动：退出码 $($p2.ExitCode)，$ms ms 后退出；第一个实例$(if ($alive) { '仍在运行' } else { '已退出' })；$($act.Line)"
          if ($alive) { $p1.Kill() }
          if ($p2.ExitCode -ne 0 -or -not $alive -or -not $act -or $act.Line -notmatch 'from-ci') { throw '单实例检查失败' }
          "cold-start: $($ff.Line)`nbackground: $($bg.Line)`nsecond-instance: exit $($p2.ExitCode) in $ms ms; $($act.Line)" | Set-Content (Join-Path $env:RUNNER_TEMP 'single-instance.txt') -Encoding UTF8

      # 内存对比（不影响构建结果）：改解包目录里的 app/MicMask.cfg（jpackage 的 JVM 参数），逐个跑 --smoke --mem-only，
      # 打印各阶段（启动 / 开窗口 / 收发 10 秒 / 关到托盘 / 再开窗口）的工作集、私有字节、堆、Metaspace。
      # runner 没有 GPU（D3D 走 WARP 软件实现），渲染后端的数字只能作相对参考。
      - name: Memory comparison (JVM flags / Skia render API)
        shell: pwsh
        continue-on-error: true
        run: |
          $dst = Join-Path $env:RUNNER_TEMP 'mm-msi'
          $exe = Get-ChildItem $dst -Recurse -Filter MicMask.exe | Select-Object -First 1
          $cfg = Get-ChildItem $exe.DirectoryName -Recurse -Filter MicMask.cfg | Select-Object -First 1
          Write-Host "cfg: $($cfg.FullName)"
          $orig = Get-Content $cfg.FullName -Encoding UTF8
          $orig | Select-String 'java-options' | ForEach-Object { Write-Host "  $_" }
          $tuned = '-XX:|^-Xm|^-Xs|^-Dskiko.renderApi|^-Dsun.java2d'
          $variants = [ordered]@{
            'A-old(G1,Xmx512m)'      = @{ drop = $true;  add = @('-Xmx512m') }
            'B-new(default)'         = @{ drop = $false; add = @() }
            'C-new+SOFTWARE'         = @{ drop = $false; add = @('-Dskiko.renderApi=SOFTWARE') }
            'D-new+OPENGL'           = @{ drop = $false; add = @('-Dskiko.renderApi=OPENGL') }
            'E-G1tuned'              = @{ drop = $true;  add = @('-XX:+UseG1GC','-Xms16m','-Xmx256m','-XX:G1PeriodicGCInterval=15000','-XX:MinHeapFreeRatio=10','-XX:MaxHeapFreeRatio=30','-XX:MaxMetaspaceSize=192m','-XX:ReservedCodeCacheSize=64m','-XX:CICompilerCount=2','-XX:-UsePerfData') }
            'F-new+C1only'           = @{ drop = $false; add = @('-XX:TieredStopAtLevel=1') }
            'G-new+noJ2D-D3D'        = @{ drop = $false; add = @('-Dsun.java2d.d3d=false') }
          }
          $summary = New-Object System.Collections.Generic.List[string]
          foreach ($k in $variants.Keys) {
            $v = $variants[$k]
            $lines = New-Object System.Collections.Generic.List[string]
            foreach ($l in $orig) {
              if ($l -match '^java-options=(.*)$') { $o = $Matches[1]; if ($v.drop -and $o -match $tuned) { continue } }
              $lines.Add($l)
              if ($l -match '^\[JavaOptions\]') { foreach ($a in $v.add) { $lines.Add("java-options=$a") } }
            }
            Set-Content $cfg.FullName $lines -Encoding UTF8
            $log = Join-Path $env:RUNNER_TEMP "mem-$k.txt"
            $p = Start-Process $exe.FullName -ArgumentList '--smoke', '--mem-only', "--smoke-out=$log" -PassThru
            $null = $p.Handle
            if (-not $p.WaitForExit(150000)) { $p.Kill(); Write-Host "$k 超时" }
            Write-Host "===== $k (exit $($p.ExitCode))"
            if (Test-Path $log) { Get-Content $log -Encoding UTF8 | Where-Object { $_ -match '^(MEM|PASS|FAIL|WINDOW)' } | ForEach-Object { Write-Host $_; if ($_ -match '^MEM  (\S+)\s+ws=([\d.]+) MB  private=([\d.]+) MB') { $summary.Add(("{0,-22} {1,-30} ws={2,7} MB  private={3,7} MB" -f $k, $Matches[1], $Matches[2], $Matches[3])) } } }
          }
          Set-Content $cfg.FullName $orig -Encoding UTF8
          Write-Host '===== 汇总'
          $summary | ForEach-Object { Write-Host $_ }
          $summary | Set-Content (Join-Path $env:RUNNER_TEMP 'mem-summary.txt') -Encoding UTF8

      - name: Collect
        run: |
          VER="${{ steps.ver.outputs.version }}"
          mkdir -p dist
          MSI=$(ls desktop/build/compose/binaries/main-release/msi/*.msi | head -n1)
          EXE=$(ls desktop/build/compose/binaries/main-release/exe/*.exe | head -n1)
          cp "$MSI" "dist/MicMask-$VER-windows-x64.msi"
          cp "$EXE" "dist/MicMask-$VER-windows-x64-setup.exe"
          ( cd dist && sha256sum * > SHA256SUMS.txt )
          ls -l dist

      # 升级测试：装上一版 Release（alpha.1 / alpha.2）的 MSI → 装这次的 MSI / EXE / 走应用内更新路径，校验只剩一个条目、版本是新的、设置保留；
      # 另外复现旧版本号方案下 alpha.1 → alpha.2 装不上的情况（截图 + msiexec 日志，只记录）。详见 desktop/packaging/upgrade-test.ps1
      - name: Upgrade test (previous releases -> this build)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $old = Join-Path $env:RUNNER_TEMP 'old'; New-Item -ItemType Directory -Force $old | Out-Null
          gh release download win-v0.1.0-alpha.1 -R $env:GITHUB_REPOSITORY -p '*.msi' -O "$old/alpha1.msi"
          gh release download win-v0.1.0-alpha.2 -R $env:GITHUB_REPOSITORY -p '*.msi' -O "$old/alpha2.msi"
          gh release download win-v0.1.0-alpha.2 -R $env:GITHUB_REPOSITORY -p '*-setup.exe' -O "$old/alpha2-setup.exe"
          $ver = '${{ steps.ver.outputs.version }}'
          $msi = (Resolve-Path "dist/MicMask-$ver-windows-x64.msi").Path
          $exe = (Resolve-Path "dist/MicMask-$ver-windows-x64-setup.exe").Path
          $upd = (Get-ChildItem (Join-Path $env:RUNNER_TEMP 'mm-msi') -Recurse -Filter MicMask.exe | Select-Object -First 1).FullName
          ./desktop/packaging/upgrade-test.ps1 -NewMsi $msi -NewExe $exe -NewVersion $ver -UpdaterExe $upd -OldDir $old -Out (Join-Path $env:RUNNER_TEMP 'upgrade-test')

      - name: Upload upgrade test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-test
          path: |
            ${{ runner.temp }}/upgrade-test/
            ${{ runner.temp }}/single-instance.txt
          if-no-files-found: ignore

      - name: Upload smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-log
          path: |
            ${{ runner.temp }}/micmask-smoke.txt
            ${{ runner.temp }}/mem-*.txt
            ${{ runner.temp }}/smoke-*.png
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: MicMask-desktop-${{ steps.ver.outputs.version }}-windows-x64
          path: dist/*
          if-no-files-found: error

      # 只有 win-v* 标签才发 Release：prerelease + --latest=false
      - name: Release
        if: startsWith(github.ref, 'refs/tags/win-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${{ steps.ver.outputs.version }}"
          TAG="$GITHUB_REF_NAME"
          awk -v v="$VER" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' desktop/CHANGELOG.md > notes.md || true
          [ -s notes.md ] || echo "MicMask 电脑版 $VER（测试版）" > notes.md
          printf '\n---\nVB-CABLE 由 VB-Audio Software 提供，是捐赠软件，欢迎到 https://vb-cable.com 支持作者；安装包原样附带其官方驱动包。\n' >> notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "MicMask 电脑版 $VER" --notes-file notes.md --prerelease --latest=false
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "MicMask 电脑版 $VER" --notes-file notes.md --verify-tag --prerelease --latest=false
          fi
