name: pages
on:
  push:
    branches: [main]
    paths: ["site/**", "docs/manual.md", "docs/screenshots/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 组装站点
        run: |
          mkdir -p _site/screenshots
          cp -r site/. _site/
          cp docs/manual.md _site/manual.md
          cp docs/screenshots/0*.png _site/screenshots/
          echo "micmask.taocrypt.com" > _site/CNAME
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: d
        uses: actions/deploy-pages@v4
